<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" lang="en" role="img" aria-labelledby="title description">
  <title id="title">Story #128 on the delivery board</title>
  <desc id="description">An automation spots a new competitor feature for choosing member roles when sending invitations. The team reviews the finding and adds it to the backlog as Story #128 after approval. The delivery board shows it in Verification, alongside GitHub Actions results for build, test deployment, and production release.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0a1928"/><stop offset=".6" stop-color="#132d3b"/><stop offset="1" stop-color="#0b1b28"/></linearGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#668997" opacity=".23"/></pattern>

    <linearGradient id="glass"><stop stop-color="#223948"/><stop offset="1" stop-color="#1a2a38"/></linearGradient>
    <filter id="lift" x="-20%" y="-30%" width="155%" height="175%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#01070d" flood-opacity=".56"/></filter>
    <clipPath id="art"><rect width="1200" height="600" rx="14"/></clipPath>
    <style>
      text { font-family: MiSans, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; fill: #eaf5f9; }
      .small { font-size: 15px; fill: #a3b7c3; } .body { font-size: 19px; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; letter-spacing: .5px; }
      .brand { fill: #213b4a; font-size: 23px; font-weight: 660; }
      .context { fill: #526977; font-size: 15px; }
      .board-heading { fill: #233e4b; font-size: 24px; font-weight: 650; }
      .lane-title { fill: #43596a; font-size: 17px; font-weight: 620; }
      .ticket { fill: #fff; stroke: #d7e0e5; }
      .ticket-id { fill: #667d8b; font: 14px 'SFMono-Regular', Consolas, monospace; }
      .ticket-title { fill: #394f5e; font-size: 18px; font-weight: 540; }
      #board:target ~ #scene .annotation { display: none; }
    </style>
  </defs>
  <view id="origin" viewBox="14 370 430 215"/>
  <view id="story" viewBox="678 301 508 293"/>
  <view id="board" viewBox="78 54 1026 462"/>
  <g id="scene" clip-path="url(#art)">
    <rect width="1200" height="600" fill="url(#canvas)"/>
