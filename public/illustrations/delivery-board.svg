<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694" role="img" aria-labelledby="title description" lang="zh-CN">
<title id="title">从外部信号到交付看板</title>
<desc id="description">GitHub Issue、IM 消息和 Webhook 事件是可配置的信号来源。示例中的 Issue #128 触发自动化 Job，登记至任务收件箱。转入交付项目后形成 Story 草稿，人员确认范围与验收条件，看板再跟踪开发、测试和审阅。</desc>
<defs>
  <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#0b1f36"/><stop offset=".57" stop-color="#12394c"/><stop offset="1" stop-color="#10253c"/></linearGradient>
  <pattern id="mesh" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#7fb7c9" opacity=".3"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7 7 0" stroke="#658e9e" opacity=".34"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="140%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#051322" flood-opacity=".32"/></filter>
  <style>text{font-family:MiSans,'PingFang SC','Microsoft YaHei',system-ui,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace;letter-spacing:.6px}</style>
</defs>
<view id="signals" viewBox="12 118 323 253"/><view id="automation" viewBox="337 99 375 280"/>
<view id="story" viewBox="724 118 362 257"/><view id="board" viewBox="57 395 981 271"/>

